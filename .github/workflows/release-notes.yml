name: Generate non-technical release notes

on:
  push:
    tags:
      - "v*"          # adjust to match this repo's actual release-tag convention

permissions:
  contents: write     # needed to commit the generated notes + manifest snapshot back to the repo

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff against the previous tag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine previous release tag
        id: prev_tag
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
          echo "current_tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          DBT_API_KEY: ${{ secrets.DBT_API_KEY }}
          DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
          DBT_HOST_URL: ${{ secrets.DBT_HOST_URL }}
          DBT_PROD_JOB_ID: ${{ secrets.DBT_PROD_JOB_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.prev_tag.outputs.current_tag }}
          PREVIOUS_TAG: ${{ steps.prev_tag.outputs.previous_tag }}
        run: python scripts/generate_release_notes.py

      - name: Commit generated notes
        run: |
          git config user.name "dbt-release-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add release-notes/ dbt_artifacts/
          git diff --cached --quiet || git commit -m "docs: release notes for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
