name: Generate non-technical release notes

# In the client's real pipeline, this becomes an additional job appended to
# `_dbt-cd.yml` after `dbt_cloud_deploy`, scoped to the `prd` environment,
# consuming `needs.dbt_cloud_deploy.outputs.run_id` directly — no manual
# input needed there. This test repo doesn't have that reusable-workflow
# structure, so a manual `run_id` input stands in for it here.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "dbt Cloud run ID for the production run to generate notes for"
        required: true
        type: string

permissions:
  contents: read   # no longer commits anything back to the repo

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate release notes
        env:
          DBT_API_KEY: ${{ secrets.DBT_API_KEY }}
          DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
          DBT_HOST_URL: ${{ secrets.DBT_HOST_URL }}
          DBT_PROD_JOB_ID: ${{ secrets.DBT_PROD_JOB_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/generate_release_notes.py

      - name: Convert release notes to PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc wkhtmltopdf
          for f in release-notes/*.md; do
            pandoc "$f" -o "${f%.md}.pdf" --pdf-engine=wkhtmltopdf
          done

      - name: Upload release notes (Markdown + PDF)
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error
